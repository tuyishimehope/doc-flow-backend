services:

  api:
    build: .
    container_name: docflow-api
    command: sh ./entrypoint.sh
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - .:/app

  worker:
    build: .
    container_name: docflow-worker
    command: celery -A app.tasks.celery_app worker --loglevel=DEBUG -E
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - .:/app

  postgres:
    # Postgres 16 with the pgvector extension (document chunks, plan_4 part C). The -trixie tag is
    # on the same Debian as postgres:16, so a postgres_data volume made by that image keeps its
    # collation version (the plain pg16 tag is on the older bookworm and warns on every connection).
    image: pgvector/pgvector:pg16-trixie
    container_name: docflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    container_name: docflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    container_name: docflow-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Virus scanner for uploads. Opt in with: docker compose --profile scan up
  # ClamAV's docs ask for at least 3 GiB of memory (4 preferred), and the first start downloads the
  # signature database, which takes a few minutes. Then set CLAMAV_HOST=clamav in .env.
  clamav:
    # The -debian tag has arm64 builds (Apple Silicon); plain 1.4 is amd64 only.
    image: clamav/clamav:1.4-debian
    container_name: docflow-clamav
    profiles: ["scan"]
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav

volumes:
  postgres_data:
  minio_data:
  clamav_db:

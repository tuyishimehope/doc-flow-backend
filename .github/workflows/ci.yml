name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: docflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      app_name: DocFlow CI
      secret_key: ci-only-secret-key-do-not-use-in-production-0123456789
      broker_host: redis://localhost:6379/0
      broker_backend: redis://localhost:6379/1
      OPENAI_API_KEY: ci-placeholder
      DATABASE_NAME: docflow
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: documents
      MINIO_SECURE: "false"
      DEPENDENCY_STARTUP_TIMEOUT_SECONDS: 5
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/test_docflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app
      - name: Type check
        run: mypy --ignore-missing-imports --follow-imports=silent app/service/document/schema.py app/service/openai/service.py app/core/config.py
      - name: Prepare isolated test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE test_docflow'
      - name: Check database migrations
        run: alembic upgrade head
      - name: Run existing tests
        run: python -m pytest -q
